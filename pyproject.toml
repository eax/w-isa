[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wisa"
version = "0.1.0"
description = "Deterministic, gradient-free weight-space instructions for local PyTorch models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mechanistic-interpretability", "weight-editing", "pytorch", "apple-silicon"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "transformers>=4.37", "numpy>=1.26"]

[project.scripts]
wisa = "wisa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wisa*"]